services:
  rag-chat:
    build: .
    image: rag-chat:latest
    container_name: rag-chat
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/app.db
      # Ollama (optional) runs on the host, not in this image. unverified: host.docker.internal is a
      # Docker feature (mapped below for Linux); Ollama's own docs don't cover container-to-host access.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
