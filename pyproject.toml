[project]
name = "rag-chat"
version = "3.0.0"
description = "Chat with your PDFs and turn them into study notes: cited answers with page links, offline with no API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["rag", "retrieval-augmented-generation", "pdf", "question-answering", "fastapi", "study-notes"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "data-offline", "*.md"]  # never rewrite the spec documents

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends()/File()/Header() in defaults is the documented pattern
  "RUF001",  # en dashes and ellipses in user-facing copy are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/evaluate.py" = ["E402"]  # sys.path tweak must precede app imports
"scripts/judge.py" = ["E402"]
"scripts/make_sample_pdf.py" = ["E501"]  # long prose paragraphs of the sample manual

[tool.ruff.format]
quote-style = "double"
